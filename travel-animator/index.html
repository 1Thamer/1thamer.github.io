<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Animator — Thamer Dev</title><style>html,body{height:100%;margin:0;background:#080b12;color:#eaf0fb;font:15px system-ui}body{display:grid;place-items:center}.card{text-align:center;padding:28px;border:1px solid #ffffff22;border-radius:16px;background:#121724cc}.spin{width:34px;height:34px;margin:0 auto 15px;border:3px solid #ffffff26;border-top-color:#4fc3f7;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#9aa7bd}</style></head><body><div class="card"><div class="spin"></div><b>Travel Animator</b><br><small>Loading application…</small></div><script>(async()=>{const b='https://bumpy-facts-jog.loca.lt/';const f=['style.css','land.js','countries.js','states-us.js','app.js'];try{const d=await Promise.all(f.map(async x=>{const r=await fetch(b+x);if(!r.ok)throw Error(x+' '+r.status);return r.text()}));let h=await(await fetch(b+'index.html')).text();h=h.replace('<link rel="stylesheet" href="css/style.css">','<style>'+d[0]+'</style>');for(let i=1;i<5;i++)h=h.replace('<script src="js/'+f[i]+'"></script>','<script>'+d[i].replaceAll('</script>','<\\/script>')+'<\/script>');document.open();document.write(h);document.close()}catch(e){document.querySelector('.card').innerHTML='<b>Could not load Travel Animator</b><br><small>'+e.message+'</small>'}})();</script></body></html>
